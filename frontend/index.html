<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegis Command Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:radial-gradient(circle at top,#0f172a,#020617)}
.glow{box-shadow:0 0 25px rgba(34,211,238,.15)}
</style>
</head>

<body class="text-gray-100 font-sans min-h-screen p-8">

<header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
<div class="flex items-center gap-3">
<div class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></div>
<h1 class="text-3xl font-bold tracking-wider text-cyan-400">AEGIS</h1>
</div>
<div class="text-sm bg-gray-900 px-4 py-2 rounded-lg border border-gray-800 glow">
Status: <span id="statusText" class="text-green-400 font-bold">SECURE</span>
</div>
</header>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

<div class="col-span-2 bg-gray-900 p-6 rounded-xl border border-gray-800 glow">
<h2 class="text-xl mb-4">Telemetry</h2>
<div class="h-96">
<canvas id="chart"></canvas>
</div>
</div>

<div class="bg-gray-900 p-6 rounded-xl border border-gray-800 glow flex flex-col">
<h2 class="text-xl mb-4">AI Activity</h2>
<div id="feed" class="flex-1 overflow-y-auto space-y-4"></div>
</div>

</div>

<script>
const ctx=document.getElementById('chart').getContext('2d');

const chart=new Chart(ctx,{
type:'line',
data:{labels:[],datasets:[
{label:'CPU',borderColor:'#22d3ee',backgroundColor:'rgba(34,211,238,.2)',fill:true,data:[]},
{label:'RAM',borderColor:'#c084fc',backgroundColor:'rgba(192,132,252,.2)',fill:true,data:[]}
]},
options:{responsive:true,maintainAspectRatio:false}
});

async function load(){
const res=await fetch('http://localhost:3000/api/dashboard');
const data=await res.json();

chart.data.labels=data.metrics.map(m=>new Date(m.timestamp).toLocaleTimeString());
chart.data.datasets[0].data=data.metrics.map(m=>m.cpu_usage);
chart.data.datasets[1].data=data.metrics.map(m=>m.memory_usage);
chart.update();

const feed=document.getElementById('feed');
const status=document.getElementById('statusText');
feed.innerHTML='';

let danger=false;

data.incidents.forEach(i=>{
if(i.status==='Open') danger=true;

const btn=i.pr_url
? `<a href="${i.pr_url}" target="_blank" class="mt-2 inline-block bg-cyan-900 hover:bg-cyan-700 text-cyan-300 text-xs px-3 py-1 rounded">VIEW PATCH</a>`
: `<p class="text-xs text-gray-500 mt-2">AI analyzing...</p>`;

feed.innerHTML+=`
<div class="p-4 bg-gray-800 rounded-lg border border-gray-700">
<div class="flex justify-between">
<div>
<p class="text-sm text-gray-400">Incident #${i.id}</p>
<p class="text-white">${i.severity}</p>
</div>
<span class="${i.status==='Open'?'text-red-400':'text-green-400'}">${i.status}</span>
</div>
${btn}
</div>`;
});

status.textContent=danger?'CRITICAL':'SECURE';
status.className=danger?'text-red-400 animate-pulse font-bold':'text-green-400 font-bold';
}

load();
setInterval(load,2000);
</script>

</body>
</html>
